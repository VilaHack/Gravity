syntax="proto3";
option go_package="github.com/Jowiies/gravity/internal/grpc";

// The Bucket service definition
service BucketService {

  // If (bucket_exists) update it else create it
  rpc UpsertBucket(UpsertBucketRequest) returns(UpsertBucketResponse){}

  // If (!bucket_exists) create it. Upload file as stream.
  rpc UploadFile(stream UploadFileRequest) returns(UploadFileResponse) {}

  rpc DownloadFile(DownloadFileRequest) returns(stream DownloadFileResponse) {}

  rpc ListFiles(ListFilesRequest) returns(ListFilesResponse){}
}


message UpsertBucketRequest {
  string name = 1;
  optional string max_size = 2;
  optional string max_file_size = 3;
  repeated string allowed_mime_types = 4;
}

message UpsertBucketResponse {
  bool was_created = 1;
}

message FileMetadata {
  string bucket_name = 1;
  string file_name = 2;
}

message UploadFileRequest {
  oneof payload {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadFileResponse {
  string file_relative_path = 1;
}

message DownloadFileRequest {
  FileMetadata metadata = 1;
}

message DownloadFileResponse {
  bytes chunk = 1;
}

message ListFilesRequest {
  string bucket_name = 1;
}

message ListFilesResponse {
  repeated string file_names = 1;
}
