syntax="proto3";
option go_package="github.com/vilahack/gravity/api/proto;gravitypb";

// The Bucket service definition
service BucketService {

  // If (bucket_exists) update it else create it
  rpc UpsertBucket(UpsertBucketRequest) returns(UpsertBucketResponse){}

  // If (!bucket_exists) create it. Upsert file as stream.
  rpc UpsertObject(stream UpsertObjectRequest) returns(UpsertObjectResponse) {}

  rpc DownloadObject(DownloadObjectRequest) returns(stream DownloadObjectResponse) {}

  rpc ListObjects(ListObjectsRequest) returns(ListObjectsResponse){}
}

message UpsertBucketRequest {
  string name = 1;
  optional string max_size = 2;
  optional string max_file_size = 3;
  repeated string allowed_mime_types = 4;
}

message UpsertBucketResponse {
  bool was_created = 1;
}

message UpsertObjectMetadata {
  string file_name = 1;
  string content_type = 2; // MIME type
  string bucket_name = 3;
  repeated string directories = 4; // Symbolic subdirectories
}

message UpsertObjectRequest {
  oneof payload {
    UpsertObjectMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UpsertObjectResponse {
  bytes checksum_sha256 = 1; //32-byte SHA-256
}

message DownloadObjectRequest {
  string file_name = 1;
}

message DownloadObjectResponse {
  bytes chunk = 1;
}

message ListObjectsRequest {
  string bucket_name = 1;
}

message ListObjectsResponse {
  repeated string file_names = 1;
}
